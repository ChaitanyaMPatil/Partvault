<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PartVault</title>
<style>
/* ══════════════════════════════════════════════════════════
   RESET + VARIABLES
══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;
  --surface:#fff;
  --border:#e2e8f0;
  --border-light:#f1f5f9;
  --text1:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --blue:#2563eb;
  --blue-lt:#eff6ff;
  --blue-md:#dbeafe;
  --green:#16a34a;
  --green-lt:#f0fdf4;
  --green-md:#dcfce7;
  --orange:#d97706;
  --orange-lt:#fffbeb;
  --orange-md:#fef3c7;
  --red:#dc2626;
  --red-lt:#fef2f2;
  --grey-lt:#f8fafc;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;
  --sidebar:216px;
  --header:52px;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  font-size:14px;color:var(--text1);
}

/* ══════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════ */
.hidden{display:none!important}

/* ══════════════════════════════════════════════════════════
   LOGIN PAGE
══════════════════════════════════════════════════════════ */
#login-page{
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.login-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r12);
  padding:40px 36px;width:380px;box-shadow:var(--shadow);
}
.login-logo{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.login-logo .pv-icon{
  width:32px;height:32px;background:var(--blue);border-radius:var(--r6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;letter-spacing:-.5px;
}
.login-logo span{font-size:18px;font-weight:700;color:var(--text1)}
.login-subtitle{font-size:13px;color:var(--text3);margin-bottom:28px}
.form-label{
  display:block;font-size:11px;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;
}
.form-group{margin-bottom:14px}
.form-input{
  width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--r8);font-size:14px;color:var(--text1);
  outline:none;transition:border-color .15s;background:#fff;
}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.btn-login{
  width:100%;padding:10px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--r8);font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s;margin-top:4px;
}
.btn-login:hover{background:#1d4ed8}
.btn-login:disabled{background:#94a3b8;cursor:not-allowed}
.login-error{
  margin-top:10px;padding:8px 12px;background:var(--red-lt);
  border:1px solid #fecaca;border-radius:var(--r6);
  font-size:13px;color:var(--red);
}
.demo-hint{
  margin-top:16px;padding:10px 12px;background:var(--blue-lt);
  border:1px solid var(--blue-md);border-radius:var(--r6);
  font-size:12px;color:#1e40af;text-align:center;
}

/* ══════════════════════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════════════════════ */
#app-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
.app-header{
  height:var(--header);min-height:var(--header);
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;
  gap:12px;z-index:100;
}
.hdr-logo{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0}
.hdr-logo .pv-icon{
  width:28px;height:28px;background:var(--blue);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:11px;
}
.hdr-logo-text{font-size:15px;font-weight:700;color:var(--text1)}
.hdr-search{
  flex:1;max-width:360px;
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r6);padding:6px 10px;
}
.hdr-search input{
  border:none;background:transparent;outline:none;
  font-size:13px;color:var(--text1);width:100%;
}
.hdr-search input::placeholder{color:var(--text3)}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.hdr-btn{
  display:flex;align-items:center;gap:4px;padding:5px 10px;
  background:#fff;border:1px solid var(--border);border-radius:var(--r6);
  font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;
  transition:background .12s;
}
.hdr-btn:hover{background:var(--bg)}
.hdr-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.hdr-btn.primary:hover{background:#1d4ed8}
.hdr-divider{width:1px;height:22px;background:var(--border)}
.hdr-user{display:flex;align-items:center;gap:8px}
.hdr-avatar{
  width:28px;height:28px;background:var(--blue);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:11px;font-weight:700;flex-shrink:0;
}
.hdr-user-name{font-size:13px;font-weight:500}
.hdr-role-badge{
  font-size:10px;font-weight:700;color:#1e40af;background:var(--blue-md);
  padding:1px 6px;border-radius:var(--r4);text-transform:uppercase;letter-spacing:.04em;
}
.hdr-logout-btn{
  padding:4px 8px;background:transparent;border:1px solid var(--border);
  border-radius:var(--r6);font-size:11px;color:var(--text3);cursor:pointer;
}
.hdr-logout-btn:hover{background:var(--bg);color:var(--text2)}

/* BODY */
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:#fff;border-right:1px solid var(--border);
  overflow-y:auto;padding:16px 0;
}
.sidebar-section-label{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.08em;
  padding:0 16px;margin-bottom:4px;margin-top:12px;
}
.sidebar-section-label:first-child{margin-top:0}
.sidebar-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px;cursor:pointer;
  font-size:13px;color:var(--text2);
  transition:background .1s,color .1s;
}
.sidebar-item:hover{background:var(--bg);color:var(--text1)}
.sidebar-item.active{background:var(--blue-lt);color:var(--blue);font-weight:600}
.sidebar-item .si-icon{font-size:14px;flex-shrink:0}
.sidebar-item .si-label{flex:1}
.sidebar-badge{
  background:var(--blue);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;
}

/* MAIN */
.main-content{flex:1;overflow-y:auto;background:var(--bg)}

/* ══════════════════════════════════════════════════════════
   STATUS BADGES
══════════════════════════════════════════════════════════ */
.status-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.badge-Done      {background:var(--green-md);color:#14532d}
.badge-InProgress{background:var(--blue-md);color:#1e3a8a}
.badge-Outlier   {background:var(--orange-md);color:#78350f}
.badge-Pending   {background:#f1f5f9;color:#475569;border:1px solid var(--border)}

/* ══════════════════════════════════════════════════════════
   DASHBOARD — STAT CARDS
══════════════════════════════════════════════════════════ */
.dashboard-wrap{padding:24px}
.dash-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:20px;
}
.dash-title{font-size:18px;font-weight:700;color:var(--text1)}
.dash-subtitle{font-size:12px;color:var(--text3);margin-top:2px}
.dash-actions{display:flex;gap:8px;flex-shrink:0}
.btn-sync{
  display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:#fff;border:1px solid var(--border);border-radius:var(--r6);
  font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;
  transition:background .12s;
}
.btn-sync:hover{background:var(--bg)}
.btn-extract{
  display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:var(--blue);color:#fff;border:1px solid var(--blue);
  border-radius:var(--r6);font-size:12px;font-weight:500;cursor:pointer;
  transition:background .12s;
}
.btn-extract:hover{background:#1d4ed8}

.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:24px;
}
.stat-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r8);
  padding:16px;display:flex;align-items:flex-start;gap:14px;
  box-shadow:var(--shadow-sm);
}
.stat-icon{
  width:40px;height:40px;border-radius:var(--r8);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.stat-icon.blue  {background:var(--blue-lt)}
.stat-icon.green {background:var(--green-lt)}
.stat-icon.orange{background:var(--orange-lt)}
.stat-icon.grey  {background:var(--grey-lt)}
.stat-number{font-size:26px;font-weight:800;line-height:1;color:var(--text1)}
.stat-label{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;margin-top:2px;
}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.stat-done-pct{font-size:11px;color:var(--green);font-weight:600}

/* ══════════════════════════════════════════════════════════
   DASHBOARD — SEARCH + TABS
══════════════════════════════════════════════════════════ */
.dash-search-row{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  background:#fff;border:1px solid var(--border);border-radius:var(--r8);
  padding:10px 16px;
}
.dash-search-row label{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;
}
.dash-search-input{
  flex:1;border:none;outline:none;font-size:13px;
  color:var(--text1);background:transparent;
}
.dash-search-input::placeholder{color:var(--text3)}
.btn-goto{
  padding:5px 14px;background:var(--blue);color:#fff;
  border:none;border-radius:var(--r6);font-size:12px;
  font-weight:600;cursor:pointer;flex-shrink:0;
  transition:background .12s;
}
.btn-goto:hover{background:#1d4ed8}
.btn-clear{
  padding:5px 10px;background:transparent;
  border:1px solid var(--border);border-radius:var(--r6);
  font-size:12px;color:var(--text3);cursor:pointer;
}
.btn-clear:hover{color:var(--text2);background:var(--bg)}

.filter-row{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);margin-bottom:16px;
  flex-wrap:wrap;gap:8px;
}
.filter-tabs{display:flex;gap:0}
.filter-tab{
  padding:8px 14px;font-size:13px;font-weight:500;color:var(--text2);
  cursor:pointer;background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .12s,border-color .12s;
}
.filter-tab:hover{color:var(--text1)}
.filter-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-count{
  display:inline-block;background:var(--bg);color:var(--text3);
  font-size:11px;padding:1px 5px;border-radius:9px;margin-left:4px;
}
.filter-tab.active .tab-count{background:var(--blue-md);color:#1e40af}
.filter-controls{
  display:flex;align-items:center;gap:10px;padding-bottom:8px;flex-wrap:wrap;
}
.sort-select{
  border:1px solid var(--border);border-radius:var(--r6);
  padding:4px 8px;font-size:12px;color:var(--text2);
  background:#fff;cursor:pointer;outline:none;
}
.dash-inline-search{
  padding:5px 10px;border:1px solid var(--border);border-radius:var(--r6);
  font-size:12px;color:var(--text1);background:#fff;outline:none;width:210px;
}
.dash-inline-search:focus{border-color:var(--blue)}

/* ══════════════════════════════════════════════════════════
   PART CARDS
══════════════════════════════════════════════════════════ */
.parts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
}
.part-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r8);
  padding:14px 16px 12px;cursor:pointer;
  border-left:3px solid transparent;
  transition:box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;gap:8px;
}
.part-card:hover{box-shadow:var(--shadow);border-color:#cbd5e1}
.part-card.s-Done      {border-left-color:var(--green)}
.part-card.s-InProgress{border-left-color:var(--blue)}
.part-card.s-Outlier   {border-left-color:var(--orange)}
.part-card.s-Pending   {border-left-color:var(--border)}
.card-top{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:8px;
}
.card-pn{font-size:13px;font-weight:700;color:var(--blue);font-family:monospace}
.card-name{
  font-size:12px;color:var(--text2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  line-clamp:2;
}
.card-meta{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text3);flex-wrap:wrap;
}
.card-meta-sep{color:var(--border)}
.card-vmrs{
  display:inline-flex;align-items:center;
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r4);padding:1px 6px;
  font-size:10px;font-weight:600;color:var(--text2);
}
.card-footer{display:flex;align-items:center;gap:8px}
.card-progress{flex:1;display:flex;align-items:center;gap:6px}
.progress-bar{
  flex:1;height:4px;background:var(--bg);
  border-radius:9999px;overflow:hidden;
}
.progress-fill{height:100%;border-radius:9999px;transition:width .3s}
.pf-Done      {background:var(--green)}
.pf-InProgress{background:var(--blue)}
.pf-Outlier   {background:var(--orange)}
.pf-Pending   {background:#cbd5e1}
.progress-pct{font-size:11px;color:var(--text3);flex-shrink:0;min-width:28px}
.card-action{
  padding:4px 10px;background:var(--blue-lt);color:var(--blue);
  border:1px solid var(--blue-md);border-radius:var(--r6);
  font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;
  white-space:nowrap;transition:background .12s;
}
.card-action:hover{background:var(--blue-md)}
.no-parts-msg{
  grid-column:1/-1;text-align:center;padding:48px 0;
  color:var(--text3);font-size:14px;line-height:2;
}

/* ══════════════════════════════════════════════════════════
   PAGINATION
══════════════════════════════════════════════════════════ */
.pagination-row{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-top:20px;padding:12px 0;
  border-top:1px solid var(--border);
}
.pg-info{font-size:12px;color:var(--text3)}
.pg-info strong{color:var(--text1)}
.pg-controls{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-btn{
  min-width:32px;height:30px;padding:0 8px;
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r6);font-size:12px;font-weight:500;
  color:var(--text2);cursor:pointer;
  transition:background .12s,border-color .12s;
}
.pg-btn:hover:not(:disabled){background:var(--bg);border-color:#94a3b8}
.pg-btn:disabled{color:var(--text3);cursor:not-allowed;opacity:.5}
.pg-btn.pg-active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg-goto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.pg-input{
  border:1px solid var(--border);border-radius:var(--r6);
  padding:3px 6px;font-size:12px;color:var(--text1);
  text-align:center;outline:none;width:52px;
}
.pg-input:focus{border-color:var(--blue)}

/* ══════════════════════════════════════════════════════════
   SKELETON LOADER
══════════════════════════════════════════════════════════ */
.skeleton-card{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r8);padding:14px 16px;min-height:130px;overflow:hidden;
}
.sk{
  background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px;
}
@keyframes shimmer{
  0%{background-position:200% 0}100%{background-position:-200% 0}
}
.sk-line{height:12px;margin-bottom:8px}
.sk-line.tall{height:18px}
.sk-line.short{width:60%}
.sk-line.xshort{width:40%}
.sk-line.bar{height:5px;margin-top:14px}

/* Search active badge */
.search-active-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--blue-md);color:#1e3a8a;
  padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;
}
.search-clear-x{cursor:pointer;font-size:13px;color:#1e40af;margin-left:2px}
.search-clear-x:hover{color:var(--red)}

/* ══════════════════════════════════════════════════════════
   PART DETAIL PAGE
══════════════════════════════════════════════════════════ */
.pd-wrap{padding:24px;min-height:100%}
.pd-breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text3);margin-bottom:16px;
}
.pd-breadcrumb a{
  color:var(--text3);cursor:pointer;text-decoration:none;
}
.pd-breadcrumb a:hover{color:var(--blue);text-decoration:underline}
.pd-breadcrumb-sep{color:var(--border)}

.pd-header-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r12);
  padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow-sm);
}
.pd-header-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:10px;
}
.pd-pn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pd-part-number{
  font-size:22px;font-weight:800;color:var(--blue);font-family:monospace;
}
.pd-meta-row{
  display:flex;align-items:center;gap:16px;
  font-size:12px;color:var(--text2);margin-bottom:16px;flex-wrap:wrap;
}
.pd-meta-item{display:flex;align-items:center;gap:5px}
.pd-desc-row{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
}
.pd-desc-label{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;min-width:80px;
}
.pd-desc-input{
  flex:1;border:1px solid var(--border);border-radius:var(--r6);
  padding:7px 10px;font-size:13px;color:var(--text1);outline:none;
  transition:border-color .15s;min-width:200px;
}
.pd-desc-input:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.08);
}
.btn-update-desc{
  padding:6px 12px;background:#fff;border:1px solid var(--border);
  border-radius:var(--r6);font-size:12px;color:var(--text2);cursor:pointer;
  white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.btn-update-desc:hover{background:var(--bg)}
.pd-progress-row{
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--text2);flex-wrap:wrap;
}
.pd-progress-label{flex-shrink:0}
.pd-mand-bar{
  flex:1;height:7px;background:var(--bg);
  border-radius:9999px;overflow:hidden;min-width:100px;
}
.pd-mand-fill{
  height:100%;background:var(--blue);
  border-radius:9999px;transition:width .3s;
}
.pd-mand-pct{flex-shrink:0;font-weight:700;font-size:13px;color:var(--blue);min-width:34px}
.pd-mand-msg{font-size:11px;color:var(--text3);flex-shrink:0}
.btn-back{
  display:flex;align-items:center;gap:4px;padding:6px 12px;
  background:#fff;border:1px solid var(--border);border-radius:var(--r6);
  font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;
  flex-shrink:0;white-space:nowrap;transition:background .12s;
}
.btn-back:hover{background:var(--bg)}

/* DETAIL BODY GRID */
.pd-body{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media(max-width:900px){.pd-body{grid-template-columns:1fr}}

/* ATTRIBUTE SECTIONS */
.attr-section{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r8);margin-bottom:16px;

<!-- ════════════════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════════════ -->
<script>
const API = 'http://localhost:5000/api';

/* ────────────────────────────────────────────────────────────
   STATE
──────────────────────────────────────────────────────────── */
const S = {
  token:      localStorage.getItem('pv_token') || null,
  user:       null,
  view:       'dashboard',

  // dashboard
  parts:      [],
  stats:      {},
  pagination: { page:1, limit:48, total:0, pages:1, has_next:false, has_prev:false },
  filter:     'all',
  searchTerm: '',
  page:       1,
  limit:      48,
  loading:    false,

  // part detail
  part:       null,
  attrDefs:   { mandatory:[], value_adding:[] },
  attrVals:   {},
};

let _searchDebounce = null;

/* ────────────────────────────────────────────────────────────
   API HELPER
──────────────────────────────────────────────────────────── */
async function apiFetch(path, opts={}) {
  const headers = {
    'Content-Type':  'application/json',
    'Authorization': S.token ? 'Bearer ' + S.token : '',
  };

  const controller = new AbortController();
  const timeout    = setTimeout(() => controller.abort(), 15000);

  let res;
  try {
    res = await fetch(API + path, {
      ...opts,
      headers,
      signal: controller.signal,
    });
  } catch (e) {
    if (e.name === 'AbortError') {
      throw { status: 408, msg: 'Request timed out (15s). Backend may be overloaded or DB locked.' };
    }
    throw { status: 0, msg: 'Cannot reach server on port 5000. Is the backend running?' };
  } finally {
    clearTimeout(timeout);
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw { status: res.status, msg: data.error || 'HTTP ' + res.status };
  return data;
}

/* ────────────────────────────────────────────────────────────
   AUTH
──────────────────────────────────────────────────────────── */
async function doLogin() {
  const username = document.getElementById('li-user').value.trim();
  const password = document.getElementById('li-pass').value;
  const errEl    = document.getElementById('li-error');
  const btn      = document.getElementById('li-btn');

  if (!username || !password) {
    showLoginError('Enter username and password.');
    return;
  }

  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    // Temporarily clear token so we don't send "Bearer old-token" on login
    const savedToken = S.token;
    S.token = null;

    const { token, user } = await apiFetch('/auth/login', {
      method: 'POST',
      body:   JSON.stringify({ username, password }),
    });

    if (!token) {
      console.error('[Login] Backend response missing token field!');
      showLoginError('Server error: no token returned. Check Flask terminal.');
      S.token = savedToken;
      return;
    }

    console.log('[Login] ✅ Token received, length:', token.length,
                ' prefix:', token.substring(0, 30) + '…');

    S.token = token;
    S.user  = user;
    localStorage.setItem('pv_token', token);
    bootApp();

  } catch (e) {
    console.error('[Login] Error:', e);
    showLoginError(e.msg || 'Cannot connect — is the backend running on port 5000?');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Sign In';
  }
}

function doLogout() {
  S.token = null; S.user = null; S.parts = [];
  localStorage.removeItem('pv_token');
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-page').style.display = '';
  document.getElementById('li-pass').value = '';
}

function showLoginError(msg) {
  const el = document.getElementById('li-error');
  el.textContent = msg; el.classList.remove('hidden');
}

/* ────────────────────────────────────────────────────────────
   BOOT
──────────────────────────────────────────────────────────── */
async function bootApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-shell').classList.remove('hidden');
  if (S.user) {
    document.getElementById('hdr-avatar').textContent = S.user.initials || '?';
    document.getElementById('hdr-name').textContent   = S.user.full_name || S.user.username;
    document.getElementById('hdr-role').textContent   = S.user.role || 'USER';
  }
  navigate('dashboard');
}

async function init() {
  if (!S.token) return;
  try { S.user = await apiFetch('/auth/me'); bootApp(); }
  catch { doLogout(); }
}

/* ────────────────────────────────────────────────────────────
   NAVIGATION
──────────────────────────────────────────────────────────── */
function navigate(view, params={}) {
  S.view = view;
  document.getElementById('si-assigned')
    .classList.toggle('active', view === 'dashboard');
  if (view === 'dashboard')        loadDashboard();
  else if (view === 'part-detail') loadPartDetail(params.partNumber);
}

/* ────────────────────────────────────────────────────────────
   DASHBOARD — LOAD
──────────────────────────────────────────────────────────── */
async function loadDashboard(resetPage=false) {
  if (resetPage) S.page = 1;
  if (S.loading) return;
  S.loading = true;

  // Show skeleton on fresh load
  if (!S.parts.length) {
    mc().innerHTML = buildDashboardShell() + buildSkeletonGrid();
    wireDashboardEvents();
  }

  const qs = new URLSearchParams({
    page:   S.page,
    limit:  S.limit,
    status: S.filter,
    search: S.searchTerm,
  });

  try {
    const data   = await apiFetch(`/parts/assigned?${qs}`);
    S.parts      = data.parts;
    S.stats      = data.stats;
    S.pagination = data.pagination;
    document.getElementById('si-assigned-count').textContent = S.stats.total || 0;
    renderDashboard();

  } catch (e) {
    mc().innerHTML = `
      <div style="
        display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:60px 24px;text-align:center;gap:16px;
      ">
        <div style="font-size:40px">⚠️</div>
        <div style="font-size:16px;font-weight:700;color:#0f172a">
          Failed to load parts
        </div>
        <div style="
          font-size:13px;color:#64748b;max-width:440px;line-height:1.6;
          background:#fef2f2;border:1px solid #fecaca;border-radius:8px;
          padding:12px 16px;
        ">
          ${esc(e.msg || 'Unknown error')}
        </div>
        <div style="font-size:12px;color:#94a3b8">
          This usually means the SQLite database is locked or the backend restarted.
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button onclick="retryDashboard()"
            style="
              padding:8px 20px;background:#2563eb;color:#fff;border:none;
              border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;
            ">
            🔄 Retry
          </button>
          <button onclick="doLogout()"
            style="
              padding:8px 20px;background:#fff;color:#475569;
              border:1px solid #e2e8f0;border-radius:6px;
              font-size:13px;cursor:pointer;
            ">
            ↩ Logout
          </button>
        </div>
        <div style="font-size:11px;color:#94a3b8;margin-top:4px">
          If retrying fails — restart the backend: <code>python app.py</code>
        </div>
      </div>`;
  } finally {
    // ✅ ALWAYS release the loading flag — prevents permanent skeleton
    S.loading = false;
  }
}

// ── RETRY with progressive delay ──────────────────────────────────────────────
let _retryCount = 0;
async function retryDashboard() {
  _retryCount++;
  const delay = Math.min(_retryCount * 2, 10); // 2s, 4s, 6s… max 10s
  showToast('Retrying in ' + delay + 's… (attempt ' + _retryCount + ')');
  await new Promise(r => setTimeout(r, delay * 1000));
  S.parts = [];
  S.loading = false;
  loadDashboard(true);
}

async function refreshDashboard() {
  S.parts = []; S.page = 1;
  showToast('🔄 Syncing…');
  await loadDashboard(true);
  showToast('✅ Synced');
}

/* ────────────────────────────────────────────────────────────
   SEARCH (debounced 400 ms)
──────────────────────────────────────────────────────────── */
function onSearchInput(val) {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => {
    S.searchTerm = val.trim();
    S.page  = 1;
    S.parts = [];
    loadDashboard(true);
  }, 400);
}

function clearSearch() {
  S.searchTerm = '';
  S.page  = 1;
  S.parts = [];
  ['hdr-search-input','dash-inline-search'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  loadDashboard(true);
}

/* ────────────────────────────────────────────────────────────
   PAGINATION
──────────────────────────────────────────────────────────── */
function setPage(n) {
  const maxP = S.pagination.pages || 1;
  n = Math.max(1, Math.min(n, maxP));
  if (n === S.page && S.parts.length) return;
  S.page  = n;
  S.parts = [];
  loadDashboard();
  document.querySelector('.main-content')?.scrollTo(0, 0);
}

/* ────────────────────────────────────────────────────────────
   FILTER TABS
──────────────────────────────────────────────────────────── */
function setFilter(f) {
  S.filter = f;
  S.page   = 1;
  S.parts  = [];
  loadDashboard(true);
}

/* ────────────────────────────────────────────────────────────
   DASHBOARD — RENDER SHELL (stats + controls)
──────────────────────────────────────────────────────────── */
function buildDashboardShell() {
  const { total=0, done=0, in_progress=0, outlier=0 } = S.stats;
  const pending = Math.max(0, total - done - in_progress - outlier);
  const doneP   = total > 0 ? Math.round(done / total * 100) : 0;

  return `
<div class="dashboard-wrap">

  <!-- Header -->
  <div class="dash-header">
    <div>
      <div class="dash-title">My Assigned Parts</div>
      <div class="dash-subtitle" id="dash-subtitle">
        ${total} parts in this batch · last synced just now
      </div>
    </div>
    <div class="dash-actions">
      <button class="btn-sync" onclick="refreshDashboard()">🔄 Sync</button>
      <button class="btn-extract"
              onclick="showToast('Export available in production')">
        ⬇ Extract List ▾
      </button>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon blue">📋</div>
      <div>
        <div class="stat-number">${total}</div>
        <div class="stat-label">Total Assigned</div>
        <div class="stat-sub">in this batch</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">✅</div>
      <div>
        <div class="stat-number" style="color:var(--green)">${done}</div>
        <div class="stat-label">Completed</div>

/* ────────────────────────────────────────────────────────────
   PAGINATION CONTROLS
──────────────────────────────────────────────────────────── */
function renderPagination() {
  const p = S.pagination;
  if (!p || p.pages <= 1) return '';

  const start    = (p.page - 1) * p.limit + 1;
  const end      = Math.min(p.page * p.limit, p.total);
  const winStart = Math.max(1, Math.min(p.page - 2, p.pages - 4));
  const winEnd   = Math.min(p.pages, winStart + 4);

  let nums = '';
  if (winStart > 1) {
    nums += `<button class="pg-btn" onclick="setPage(1)">1</button>`;
    if (winStart > 2)
      nums += `<span style="padding:0 4px;color:var(--text3)">…</span>`;
  }
  for (let i = winStart; i <= winEnd; i++) {
    nums += `<button class="pg-btn${i===p.page?' pg-active':''}"
      onclick="setPage(${i})">${i}</button>`;
  }
  if (winEnd < p.pages) {
    if (winEnd < p.pages - 1)
      nums += `<span style="padding:0 4px;color:var(--text3)">…</span>`;
    nums += `<button class="pg-btn" onclick="setPage(${p.pages})">${p.pages}</button>`;
  }

  return `
<div class="pagination-row">
  <span class="pg-info">
    Showing <strong>${start.toLocaleString()}–${end.toLocaleString()}</strong>
    of <strong>${p.total.toLocaleString()}</strong> parts
  </span>

  <div class="pg-controls">
    <button class="pg-btn" onclick="setPage(${p.page-1})"
            ${!p.has_prev?'disabled':''}>‹ Prev</button>
    ${nums}
    <button class="pg-btn" onclick="setPage(${p.page+1})"
            ${!p.has_next?'disabled':''}>Next ›</button>
  </div>

  <div class="pg-goto">
    <span>Page</span>
    <input class="pg-input" type="number"
           min="1" max="${p.pages}" value="${p.page}"
           onchange="setPage(parseInt(this.value)||1)"
           onkeydown="if(event.key==='Enter')setPage(parseInt(this.value)||1)"/>
    <span>of ${p.pages.toLocaleString()}</span>
  </div>
</div>`;
}

──────────────────────────────────────────────────────────── */
function jumpToPart() {
  const raw = (document.getElementById('pn-jump-input')?.value || '').trim();
  if (!raw) { showToast('Enter a part number'); return; }
  // Check current page first for instant nav
  const local = S.parts.find(p => p.part_number.toUpperCase() === raw.toUpperCase());
  if (local) { navigate('part-detail', { partNumber: local.part_number }); return; }
  // Otherwise try fetching directly from API
  navigate('part-detail', { partNumber: raw.toUpperCase() });
}

/* ────────────────────────────────────────────────────────────
   PART DETAIL — LOAD
──────────────────────────────────────────────────────────── */
async function loadPartDetail(partNumber) {
  mc().innerHTML = `<div class="loader">⏳ Loading ${esc(partNumber)}…</div>`;
  try {
    const data = await apiFetch(`/parts/${encodeURIComponent(partNumber)}`);
    S.part     = data;
    S.attrDefs = data.attr_definitions || { mandatory:[], value_adding:[] };
    S.attrVals = {};

    // Deep-copy existing saved values
    Object.entries(data.part_attributes || {}).forEach(([id, val]) => {
      S.attrVals[id] = { ...val };
    });

    // Initialise any missing entries from definitions
    [...S.attrDefs.mandatory, ...S.attrDefs.value_adding].forEach(d => {
      const key = String(d.id);
      if (!S.attrVals[key])
        S.attrVals[key] = { value:'', uom: d.default_uom||'—', has_outlier:false };
    });

    renderPartDetail();
  } catch (e) {
    mc().innerHTML = `
      <div class="loader" style="color:var(--red)">
        ❌ ${esc(e.msg || 'Part not found')}
        <br><br>
        <button class="btn-back" onclick="navigate('dashboard')">
          ‹ Back to Dashboard
        </button>
      </div>`;
  }
}

function renderAttrRows(defs) {
  if (!defs.length) return `

        style="text-align:center;color:var(--text3);padding:20px">
      No attributes defined for this VMRS code.
    </td></tr>`;

  const UOM_OPTS  = ['mm','cm','m','in','kg','g','bar','psi','°C','°F','%','kN','N','Nm','rpm','V','—'];
  const TYPE_OPTS = ['Dimensional','Material','Performance','General Attribute'];
  const UOMT_OPTS = ['Length','Diameter','Area','Volume','Mass','Temperature',
                     'Pressure','Force','Torque','Speed','Ratio','General','Weight'];

  return defs.map(d => {
    const av     = S.attrVals[String(d.id)] || { value:'', uom:d.default_uom||'—', has_outlier:false };
    const filled = av.value && av.value.trim();
    const clsKey = (d.classification||'').replace(/\s+/g,'-');

    const uomOpts  = UOM_OPTS .map(u => `<option${av.uom===u?' selected':''}>${u}</option>`).join('');
    const typeOpts = TYPE_OPTS.map(t => `<option${d.attr_type===t?' selected':''}>${t}</option>`).join('');
    const uomtOpts = UOMT_OPTS.map(t => `<option${d.uom_type===t?' selected':''}>${t}</option>`).join('');

    return `
<tr class="${av.has_outlier?'row-outlier':''}" data-id="${d.id}">
  <td class="td-code">${esc(d.attr_code)}</td>
  <td class="td-name">${esc(d.attr_name)}<span class="td-required">*</span></td>
  <td>
    <div class="val-wrap">
      <span class="val-dot ${filled?'filled':'empty'}">${filled?'●':'○'}</span>
      <input class="val-input" type="text"
             value="${esc(av.value||'')}"
             placeholder="Enter value"
             data-id="${d.id}"/>
    </div>
  </td>
  <td>
    <select class="uom-select" data-id="${d.id}" data-field="uom">
      ${uomOpts}
    </select>
  </td>
  <td>
    <select class="type-select" data-id="${d.id}" data-field="attr_type">
      ${typeOpts}
    </select>
  </td>
  <td>
    <select class="type-select" data-id="${d.id}" data-field="uom_type">
      ${uomtOpts}
    </select>
  </td>
  <td>
    <span class="cls-badge cls-${clsKey}">${esc(d.classification)}</span>
  </td>
  <td>
    ${av.has_outlier
      ? `<span class="outlier-icon" title="Outlier flagged">⚠️</span>`
      : `<span class="normal-icon">📌</span>`}
  </td>
</tr>`;
  }).join('');
}

/* ────────────────────────────────────────────────────────────
   ATTRIBUTE EVENT LISTENERS
──────────────────────────────────────────────────────────── */
function attachAttrListeners(tbodyId) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;

  // Value input
  tbody.addEventListener('input', e => {
    if (!e.target.classList.contains('val-input')) return;
    const id  = String(e.target.dataset.id);
    const val = e.target.value;
    if (!S.attrVals[id]) S.attrVals[id] = { value:'', uom:'—', has_outlier:false };
    S.attrVals[id].value = val;

    // Update indicator dot
    const row = e.target.closest('tr');
    const dot = row?.querySelector('.val-dot');
    if (dot) {
      dot.textContent = val.trim() ? '●' : '○';
      dot.className   = `val-dot ${val.trim() ? 'filled' : 'empty'}`;
    }
    updateProgress();
  });

  // UOM / type selects
  tbody.addEventListener('change', e => {
    const id    = String(e.target.dataset.id  || '');
    const field = e.target.dataset.field || '';
    if (!id || !field) return;
    if (!S.attrVals[id]) S.attrVals[id] = { value:'', uom:'—', has_outlier:false };
    S.attrVals[id][field] = e.target.value;
  });
}

function handleAddAttr() {
  const name = document.getElementById('add-name')?.value.trim();
  if (!name) { showToast('Enter an attribute name'); return; }
  showToast(`Custom attribute "${name}" queued — saved with next save action`);
  ['add-name','add-value','add-uom'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
}

/* ────────────────────────────────────────────────────────────
   PROGRESS TRACKING
──────────────────────────────────────────────────────────── */
function countFilledMandatory() {
  return S.attrDefs.mandatory.filter(d =>
    (S.attrVals[String(d.id)]?.value || '').trim()
  ).length;
}

function countFilledVA() {
  return S.attrDefs.value_adding.filter(d =>
    (S.attrVals[String(d.id)]?.value || '').trim()
  ).length;
}

function updateProgress() {
  const mTotal   = S.attrDefs.mandatory.length;
  const mFilled  = countFilledMandatory();
  const mPct     = mTotal ? Math.round(mFilled / mTotal * 100) : 0;
  const vaTotal  = S.attrDefs.value_adding.length;
  const vaFilled = countFilledVA();

  const q = id => document.getElementById(id);

  // Header bar
  if (q('pd-mand-fill')) q('pd-mand-fill').style.width = mPct + '%';
  if (q('pd-mand-pct'))  q('pd-mand-pct').textContent  = mPct + '%';
  if (q('pd-mand-msg'))  q('pd-mand-msg').textContent  =
    `${mFilled} of ${mTotal} mandatory filled · ` +
    (mFilled < mTotal ? 'complete all to unlock Save' : '✅ All mandatory filled');

  // Section progress
  if (q('sec-fill-m'))  q('sec-fill-m').style.width  = (mTotal ? mFilled/mTotal*100 : 0) + '%';
  if (q('sec-count-m')) q('sec-count-m').textContent  = `${mFilled}/${mTotal}`;
  if (q('sec-fill-va')) q('sec-fill-va').style.width  = (vaTotal ? vaFilled/vaTotal*100 : 0) + '%';
  if (q('sec-count-va'))q('sec-count-va').textContent = `${vaFilled}/${vaTotal}`;

  // Action bar
  if (q('ac-filled')) q('ac-filled').textContent = mFilled;

  // Save & Complete button lock
  const btn = q('btn-complete');
  if (btn) {
    btn.disabled    = mFilled < mTotal;
    btn.textContent = (mFilled < mTotal ? '🔒 ' : '💾 ') + 'Save & Complete';
  }
}

/* ────────────────────────────────────────────────────────────
   SAVE
──────────────────────────────────────────────────────────── */
async function handleSave(saveType) {
  if (!S.part) return;

  if (saveType === 'complete') {
    const needed = S.attrDefs.mandatory.length;
    if (countFilledMandatory() < needed) {
      showToast(`Fill all ${needed} mandatory attributes to complete`);
      return;
    }
  }

  const attributes = Object.entries(S.attrVals).map(([id, d]) => ({
    attr_def_id: parseInt(id),
    value:       d.value || '',
    uom:         d.uom   || '—',
  }));
  const description = document.getElementById('pd-desc')?.value
                    || S.part.description;

  try {
    await apiFetch(`/parts/${encodeURIComponent(S.part.part_number)}/save`, {
      method: 'POST',
      body:   JSON.stringify({ save_type: saveType, description, attributes }),
    });
    showToast(saveType === 'complete'
      ? '✅ Part saved & completed!'
      : '💾 Saved as partial');
    // Refresh dashboard data silently then navigate back
    try {
      const data = await apiFetch('/parts/assigned?page=1&limit=48&status=all&search=');
      S.parts = data.parts; S.stats = data.stats; S.pagination = data.pagination;
      document.getElementById('si-assigned-count').textContent = S.stats.total || 0;
    } catch {}
    setTimeout(() => navigate('dashboard'), 900);
  } catch (e) {
    showToast(`❌ Save failed: ${e.msg || 'Unknown error'}`);
  }
}

/* ────────────────────────────────────────────────────────────
   UTILS
──────────────────────────────────────────────────────────── */
function mc() { return document.getElementById('main-content'); }

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let _toastTimer;
function showToast(msg, ms=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* ────────────────────────────────────────────────────────────
   GLOBAL EVENT LISTENERS
──────────────────────────────────────────────────────────── */
// Login button + Enter key
document.getElementById('li-btn')
  .addEventListener('click', doLogin);
['li-user', 'li-pass'].forEach(id =>
  document.getElementById(id)
    .addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
);

// Header search — Enter to jump/search
document.getElementById('hdr-search-input')
  .addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const val = e.target.value.trim();
    if (!val) return;

    if (S.view === 'dashboard') {
      // Sync into the inline search box and run search
      const ds = document.getElementById('dash-inline-search');
      if (ds) ds.value = val;
      S.searchTerm = val; S.page = 1; S.parts = [];
      loadDashboard(true);
    } else {
      // On detail page — jump directly to part number
      navigate('part-detail', { partNumber: val.toUpperCase() });
    }
  });

/* ────────────────────────────────────────────────────────────
   BOOT ON PAGE LOAD
──────────────────────────────────────────────────────────── */
init();
</script>
</body>
